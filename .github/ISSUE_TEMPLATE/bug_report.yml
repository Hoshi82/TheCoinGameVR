name: Bug report
description: Report a reproducible VR, controls, or installation problem.
title: "[Bug]: "
body:
  - type: input
    id: versions
    attributes:
      label: Game and mod versions
      placeholder: "The Coin Game 1.0.11 / mod 0.0.89"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware and runtime
      description: Windows version, headset, OpenXR runtime, GPU, and controller/input.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Attach MelonLoader/Latest.log. Review personal paths before sharing.
